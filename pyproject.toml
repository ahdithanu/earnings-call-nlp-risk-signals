[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "earnings-signals"
version = "1.0.0"
description = "NLP pipeline measuring hedging language in S&P 500 earnings calls and testing whether it predicts near-term earnings"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ahdithan Uthayakumar" }]
dependencies = [
    "datasets>=2.19",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "requests>=2.31",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff==0.15.8",
    "mypy==1.19.1",
    "pandas-stubs>=2.0",
]

[project.urls]
Repository = "https://github.com/ahdithanu/earnings-call-nlp-risk-signals"
Explorer = "https://ahdithanu.github.io/earnings-call-nlp-risk-signals/"

[tool.setuptools]
packages = ["earnings_signals"]

[tool.ruff]
line-length = 100
target-version = "py311"
# the legacy exploratory notebook predates the pipeline and is kept as-is
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # long lines in docstrings/report strings are deliberate
    "SIM108", # ternary rewrites often hurt readability here
]

[tool.mypy]
python_version = "3.12"
packages = ["earnings_signals"]
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true  # datasets/statsmodels ship no stubs

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["earnings_signals"]
